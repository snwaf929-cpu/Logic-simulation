name: Apply 100 MHz stability optimization v2

on:
  push:
    branches:
      - agent/editor-v2-1b

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/editor-v2-1b
          fetch-depth: 0

      - name: Apply trusted native-64 batch path and larger worker chunk
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          surface = Path('src/client/java/com/foreverspark/logicsim/client/render/RealtimeDisplaySurface.java')
          text = surface.read_text()
          anchor = '''        /** Apply a complete simulator batch with one release publication and one tile-revision commit. */
          public void recordBatch(long[] raws, int count) {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one Surface.recordBatch anchor, found {text.count(anchor)}')
          trusted = '''        /**
           * Pixel-only native-64 batch used by the compiled physical DISPLAY hot path.
           *
           * <p>The caller has already proven that every command is OP_PIXEL and every X/Y coordinate is in range.
           * Rechecking opcode and bounds here costs hundreds of millions of branches per second at a 100 MHz clock.
           * Large random batches also touch effectively the whole wall, so over-invalidating tile metadata once per
           * batch is much cheaper than recomputing and OR-ing a dirty-tile bit for every pixel. Over-invalidation is
           * render-only; framebuffer contents and clock semantics are unchanged.</p>
           */
          public void recordTrustedPixelBatch(long[] raws, int count) {
              if (raws == null || count <= 0) return;
              int limit = Math.min(count, raws.length);
              if (limit <= 0) return;
              if (density != BACKING_TILE_SIZE) {
                  recordBatch(raws, limit);
                  return;
              }

              boolean invalidateWholeWall = limit >= Math.max(64, tileRevisions.length << 3);
              if (!invalidateWholeWall) Arrays.fill(batchDirtyTileWords, 0L);

              char[] framebuffer = pixels;
              int stride = backingWidth;
              int tileColumns = columns;
              boolean changed = false;
              int nonZeroDelta = 0;

              for (int commandIndex = 0; commandIndex < limit; commandIndex++) {
                  long raw = raws[commandIndex];
                  int globalX = (int) ((raw >>> 16) & 0xFFFFL);
                  int globalY = (int) ((raw >>> 32) & 0xFFFFL);
                  int rgb565 = (int) raw & 0xFFFF;
                  int pixelIndex = globalY * stride + globalX;
                  int previous = framebuffer[pixelIndex];
                  if (previous == rgb565) continue;

                  framebuffer[pixelIndex] = (char) rgb565;
                  if (previous == 0 && rgb565 != 0) nonZeroDelta++;
                  else if (previous != 0 && rgb565 == 0) nonZeroDelta--;
                  changed = true;

                  if (!invalidateWholeWall) {
                      int tileIndex = (globalY >>> BACKING_TILE_SHIFT) * tileColumns + (globalX >>> BACKING_TILE_SHIFT);
                      batchDirtyTileWords[tileIndex >>> 6] |= 1L << (tileIndex & 63);
                  }
              }

              if (!changed) return;
              if (nonZeroDelta != 0) nonZeroPixels += nonZeroDelta;
              long next = ++revision;
              if (invalidateWholeWall) Arrays.fill(tileRevisions, next);
              else commitDirtyTiles(next);
              publishedRevision = next;
          }

'''
          text = text.replace(anchor, trusted + anchor, 1)
          surface.write_text(text)

          mixin = Path('src/client/java/com/foreverspark/logicsim/mixin/client/CircuitBlockIndependentRandomDisplayMixin.java')
          text = mixin.read_text()
          old_chunk = 'private static final long LOGIC_INDEPENDENT_EDGE_CHUNK = 131_072L;'
          if text.count(old_chunk) != 1:
              raise SystemExit(f'Expected one independent chunk constant, found {text.count(old_chunk)}')
          text = text.replace(old_chunk, 'private static final long LOGIC_INDEPENDENT_EDGE_CHUNK = 262_144L;', 1)
          old_comment = '/** 131K edges = 65K rising samples; large enough to amortize worker bookkeeping without long monitor stalls. */'
          new_comment = '/** 262K edges = 131K rising samples; halves sink/scheduler overhead while staying near one worker wall slice. */'
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)
          if text.count('surface::recordBatch') != 1:
              raise SystemExit(f'Expected one independent surface::recordBatch sink, found {text.count("surface::recordBatch")}')
          text = text.replace('surface::recordBatch', 'surface::recordTrustedPixelBatch', 1)
          text = text.replace('mode=independent-trigger-hotloop-v3 maxEdgeChunk={}',
                              'mode=independent-trigger-hotloop-v3-stable100 maxEdgeChunk={} displayBatch={}', 1)
          old_args = '''                    LOGIC_INDEPENDENT_EDGE_CHUNK,
                    surface == null ? 0 : surface.logicalWidth(),'''
          new_args = '''                    LOGIC_INDEPENDENT_EDGE_CHUNK,
                    surface != null && surface.density() == 64 ? "trusted-native64" : "generic-fallback",
                    surface == null ? 0 : surface.logicalWidth(),'''
          if text.count(old_args) != 1:
              raise SystemExit('Could not locate log argument insertion point')
          text = text.replace(old_args, new_args, 1)
          mixin.write_text(text)

          test = Path('src/client/java/com/foreverspark/logicsim/client/render/RealtimeDisplayNative64SelfTest.java')
          test.write_text(r'''package com.foreverspark.logicsim.client.render;

import com.foreverspark.logicsim.display.DisplayCommandCodec;
import net.minecraft.core.BlockPos;

import java.lang.reflect.Constructor;

/** Regression for the trusted pixel-only 64px/tile framebuffer batch used by the 100 MHz physical DISPLAY path. */
public final class RealtimeDisplayNative64SelfTest {
    private RealtimeDisplayNative64SelfTest() {}

    public static void main(String[] args) throws Exception {
        Constructor<RealtimeDisplaySurface.Surface> constructor = RealtimeDisplaySurface.Surface.class
                .getDeclaredConstructor(BlockPos.class, int.class, int.class, int.class, int.class);
        constructor.setAccessible(true);
        RealtimeDisplaySurface.Surface surface = constructor.newInstance(BlockPos.ZERO, 2, 2, 64, 4);

        long[] dense = new long[64];
        for (int index = 0; index < dense.length; index++) {
            int x = (index * 37) & 127;
            int y = (index * 53) & 127;
            dense[index] = DisplayCommandCodec.pixel(x, y, index + 1);
        }

        surface.recordTrustedPixelBatch(dense, dense.length);
        check(surface.publishedRevision() == 1L, "first trusted native-64 batch must publish exactly once");
        check(surface.nonZeroPixels() == 64, "64 unique non-zero pixels expected");
        for (int tile = 0; tile < surface.tileSlots(); tile++) {
            check(surface.tileRevision(tile) == 1L, "dense trusted batch may safely invalidate every tile once");
        }

        surface.recordTrustedPixelBatch(dense, dense.length);
        check(surface.publishedRevision() == 1L, "identical trusted batch must not publish a new revision");
        check(surface.nonZeroPixels() == 64, "identical trusted batch must preserve non-zero count");

        long[] one = {DisplayCommandCodec.pixel(1, 1, 0xFFFF)};
        surface.recordTrustedPixelBatch(one, one.length);
        check(surface.publishedRevision() == 2L, "small changed batch must publish one new revision");
        check(surface.tileRevision(0) == 2L, "small batch must dirty the touched tile");
        for (int tile = 1; tile < surface.tileSlots(); tile++) {
            check(surface.tileRevision(tile) == 1L, "small batch must not over-invalidate unrelated tiles");
        }
        check(surface.pixelRgb565(1, 1) == 0xFFFF, "trusted native-64 framebuffer write mismatch");

        System.out.println("Realtime DISPLAY trusted native-64 batch self-test: PASS"
                + " | logical=128x128 batch=64 metadata=dense-whole-wall-or-small-dirty-bit");
    }

    private static void check(boolean condition, String message) {
        if (!condition) throw new AssertionError(message);
    }
}
''')

          build = Path('build.gradle')
          text = build.read_text()
          task_anchor = "tasks.register('displayBatch32SelfTest', JavaExec) {"
          if text.count(task_anchor) != 1:
              raise SystemExit('displayBatch32SelfTest task anchor missing')
          new_task = '''tasks.register('displayNative64SelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates the trusted pixel-only native-64 realtime DISPLAY batch writer.'
    dependsOn clientClasses
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.client.render.RealtimeDisplayNative64SelfTest'
}

'''
          text = text.replace(task_anchor, new_task + task_anchor, 1)
          dep_anchor = "    dependsOn tasks.named('displayBatch32SelfTest')"
          if text.count(dep_anchor) != 1:
              raise SystemExit('displayBatch32 check dependency anchor missing')
          text = text.replace(dep_anchor, dep_anchor + "\n    dependsOn tasks.named('displayNative64SelfTest')", 1)
          build.write_text(text)
          PY

          git diff --check

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Run exact verification gate
        shell: bash
        run: gradle build selfTest infrastructureSelfTest clientSelfTest displayRendererSelfTest --stacktrace

      - name: Commit optimized runtime and remove helpers
        shell: bash
        run: |
          git config user.name "snwaf929-cpu"
          git config user.email "snwaf929@gmail.com"
          rm -f .github/workflows/apply-100mhz-stability.yml .github/workflows/apply-100mhz-stability-v2.yml
          git add -A
          git diff --cached --check
          git commit -m "Stabilize 100 MHz physical DISPLAY hot path"
          git push origin HEAD:agent/editor-v2-1b
