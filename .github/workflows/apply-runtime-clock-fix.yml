name: Apply runtime CLOCK 100 MHz fix

on:
  push:
    branches:
      - agent/editor-v2-1b

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-clock-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/editor-v2-1b
          fetch-depth: 0

      - name: Apply exact runtime clamp fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('src/main/java/com/foreverspark/logicsim/editor/runtime/CircuitTimingController.java')
          text = controller.read_text()
          old = 'Math.min(50_000_000L, node.clockFrequencyHz)'
          new = 'Math.min(100_000_000L, node.clockFrequencyHz)'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one runtime 50 MHz clamp, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if '50_000_000L, node.clockFrequencyHz' in text:
              raise SystemExit('A runtime 50 MHz CLOCK clamp still remains')
          controller.write_text(text)

          test = Path('src/main/java/com/foreverspark/logicsim/tools/TimingIntegrationCheck.java')
          text = test.read_text()
          old_frequency = 'clock.clockFrequencyHz = 5_000_000L;'
          old_assertion = 'TimingIntegrationAssertions.require(timing.frequencyHz(CompiledCircuit.ROOT_SCOPE, clock.id) == 5_000_000L, "5 MHz preserved");'
          if text.count(old_frequency) != 1 or text.count(old_assertion) != 1:
              raise SystemExit('TimingIntegrationCheck no longer matches expected 5 MHz baseline')
          text = text.replace(old_frequency, 'clock.clockFrequencyHz = 100_000_000L;', 1)
          replacement = '''TimingIntegrationAssertions.require(timing.frequencyHz(CompiledCircuit.ROOT_SCOPE, clock.id) == 100_000_000L, "100 MHz preserved by runtime timing controller");
                  TimingIntegrationAssertions.require(clock.clockFrequencyHz == 100_000_000L, "runtime must not rewrite 100 MHz CLOCK to 50 MHz");'''
          text = text.replace(old_assertion, replacement, 1)
          test.write_text(text)
          PY

          grep -n "Math.min(100_000_000L, node.clockFrequencyHz)" src/main/java/com/foreverspark/logicsim/editor/runtime/CircuitTimingController.java
          grep -n "100 MHz preserved by runtime timing controller\|runtime must not rewrite 100 MHz CLOCK to 50 MHz" src/main/java/com/foreverspark/logicsim/tools/TimingIntegrationCheck.java

      - name: Commit direct source fix
        shell: bash
        run: |
          git config user.name "snwaf929-cpu"
          git config user.email "snwaf929@gmail.com"
          git add src/main/java/com/foreverspark/logicsim/editor/runtime/CircuitTimingController.java src/main/java/com/foreverspark/logicsim/tools/TimingIntegrationCheck.java
          git diff --cached --check
          git commit -m "Remove stale 50 MHz runtime CLOCK clamp [runtime-clock-fix-applied]"
          git push origin HEAD:agent/editor-v2-1b
