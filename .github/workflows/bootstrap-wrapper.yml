name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether wrapper exists
        id: wrapper
        shell: bash
        run: |
          if [ -f gradlew ] && [ -f gradlew.bat ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        if: steps.wrapper.outputs.missing == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        if: steps.wrapper.outputs.missing == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Generate wrapper
        if: steps.wrapper.outputs.missing == 'true'
        run: gradle wrapper --gradle-version 9.5.1

      - name: Commit wrapper
        if: steps.wrapper.outputs.missing == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "Add Gradle wrapper"
          git push
