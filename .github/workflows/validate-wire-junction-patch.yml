name: Validate Wire Junction Patch

on:
  push:
    branches: [ cpu-infra-rails-clock ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Apply generated junction patch
        run: python3 tools/apply_wire_junction_patch.py

      - name: Build and test patched source
        run: gradle build selfTest --stacktrace

      - name: Package patched source
        run: |
          mkdir -p patched-source/src/main/java patched-source/src/client/java
          cp -R src/main/java/* patched-source/src/main/java/
          cp -R src/client/java/* patched-source/src/client/java/

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: wire-junction-patched-source
          path: patched-source
