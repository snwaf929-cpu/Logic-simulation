plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "logicsimulation" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Loom automatically adds the Minecraft/Fabric repositories we need.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free core logic self-tests.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.LogicSelfTest'
}

tasks.register('infrastructureSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs CPU editor bus, constant, probe, splitter, and merger regression tests.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.InfrastructureSelfTest'
}

tasks.register('displaySelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs RGB565 framebuffer and pixel-write regression tests.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.DisplayFramebufferSelfTest'
}

tasks.register('displayPipelineSelfTest', JavaExec) {
    group = 'verification'
    description = 'Compiles a real SCREEN OUTPUT board and verifies DATA64 draws a non-black framebuffer pixel.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.DisplayPipelineSelfTest'
}

tasks.register('physicalCableSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates 1-bit signal and 2/4/8/16/32/64-bit physical bus rules.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.PhysicalCableSelfTest'
}

tasks.register('clockMathSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates virtual clock frequency accounting, work budgets, and backlog preservation.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.ClockMathChecks'
}

tasks.register('clockSignalSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates virtual clock edges driving and settling NAND logic.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.ClockSignalChecks'
}

tasks.register('randomSourceSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates RANDOM probability endpoints, rising-edge behavior, and CLOCK triggering.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.RandomSourceSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('displaySelfTest')
    dependsOn tasks.named('displayPipelineSelfTest')
    dependsOn tasks.named('physicalCableSelfTest')
    dependsOn tasks.named('clockMathSelfTest')
    dependsOn tasks.named('clockSignalSelfTest')
    dependsOn tasks.named('randomSourceSelfTest')
}

tasks.register('clientSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs client-side chip-library persistence regression tests without launching Minecraft.'
    dependsOn clientClasses
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.client.chip.LibraryPersistenceSelfTest'
}

tasks.register('displayRendererSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates display front-face rotation, depth testing, and pixel-plane placement.'
    dependsOn clientClasses
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.client.render.DisplayRendererSelfTest'
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the early accurate/event-driven logic benchmark.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.foreverspark.logicsim.tools.BenchmarkMain'
}
